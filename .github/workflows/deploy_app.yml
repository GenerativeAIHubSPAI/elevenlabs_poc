name: Deploy App

on:

  push:

    branches:
      - main

    paths:
      - "frontend/**"
      - "app/**"
      - "main.py"
      - "requirements.txt"
      - "Dockerfile.aws"
      - ".github/workflows/deploy_app.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-west-3
      ECR_REPOSITORY: voice-assistant
      ECS_SERVICE: aiademo-voice-assistant-service
      ECS_CLUSTER: aiademo-cluster
      TASK_DEFINITION_NAME: voice-assistant
      CONTAINER_NAME: voice-assistant
      CLOUDFRONT_DISTRIBUTION_ID: EXOZMRRC0GDGG
      # Must match the runtime APP_PREFIX env var in the ECS task definition
      # and the CloudFront path-based behavior for this demo.
      APP_PREFIX: /demo5-voice-assistant

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::442042532301:role/GitHubAction-ECR-Push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile.aws \
            --build-arg APP_PREFIX=$APP_PREFIX \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ env.TASK_DEFINITION_NAME }} --query taskDefinition > task-definition.json

      # Also sets the container health check, so it is versioned here rather than
      # edited by hand in the console. /usr/local/bin/healthcheck comes from
      # Dockerfile.aws and goes through nginx to uvicorn.
      - name: Clean task definition
        run: |
          jq --arg name "$CONTAINER_NAME" '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .enableFaultInjection)
            | .containerDefinitions |= map(
                if .name == $name then
                  .healthCheck = {
                    command: ["CMD", "/usr/local/bin/healthcheck"],
                    interval: 15,
                    timeout: 5,
                    retries: 3,
                    startPeriod: 30
                  }
                else . end
              )
          ' task-definition.json > cleaned-task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: cleaned-task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      # Before the deploy, not after: with desiredCount 0 the stability wait below
      # succeeds instantly with no task running.
      - name: Ensure the service runs a task
        run: |
          DESIRED=$(aws ecs describe-services --cluster $ECS_CLUSTER --services $ECS_SERVICE --query 'services[0].desiredCount' --output text)
          if [ "$DESIRED" -eq "0" ]; then
            echo "Service desired count is 0. Updating to 1..."
            aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --desired-count 1 > /dev/null
          fi

      # Stability means the new task passed the container and ALB health checks
      # and the old one drained -- that is the deployment check. The former
      # public-IP lookup could pick the old task, and failed the run when tasks
      # have no public IP even though the deploy had succeeded.
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 15
          force-new-deployment: true

      - name: Show ECS service events
        if: failure()
        run: |
          aws ecs describe-services --cluster $ECS_CLUSTER --services $ECS_SERVICE --query 'services[0].events[0:10].[createdAt,message]' --output table

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "${{ env.APP_PREFIX }}/*" "${{ env.APP_PREFIX }}/"
